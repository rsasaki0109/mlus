[package]
name = "mlus"
version = "0.5.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "Local GPU admission control for ML workloads"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"
libc = "0.2"
